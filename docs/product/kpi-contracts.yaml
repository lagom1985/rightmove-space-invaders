# KPI contracts SSOT. Created by DISTILL for rightmove-invaders-sound, 2026-10-23 (revision 3).
# DEVOPS was skipped, so DISTILL defines the contracts from DISCUSS's outcome KPIs.
# gate: hard = must pass before the feature is done; soft = recorded and reviewed, not blocking.
# Playtest protocol (K1-K4, K8, K9): 5 people matching casual-arcade-player, not on the team; three waves
# each: waves 1-2 one muted and one with sound (order alternated between people), wave 3 with sound on and
# M/N free to use; n recorded with every result.

feature: rightmove-invaders-sound
kpis:
  - id: K1
    name: Hits feel better with sound
    target: ">= 4 of 5 playtesters prefer the wave with sound"
    measured_by: playtest form
    window: once, before closing the feature
    gate: soft
  - id: K2
    name: The beat adds urgency
    target: ">= 4 of 5 say the last 10 hurdles felt more urgent with the beat"
    measured_by: playtest form
    window: once, before closing the feature
    gate: soft
  - id: K3
    name: Mute is discoverable
    target: "5 of 5 find how to mute within 10 s, unaided"
    measured_by: timed playtest task
    window: once, before closing the feature
    gate: soft
  - id: K4
    name: Music is wanted
    target: ">= 60% have music on at the end of wave 3; 40-60%: re-tune once and repeat; still < 60% after the repeat, or < 40% at first: drop slices 06-07"
    measured_by: "observing the N setting at the end of wave 3; the form also asks: could you hear the beat over the music?"
    window: once after slice 07, plus one repeat if 40-60%
    gate: soft
  - id: K5
    name: Sound is immediate
    target: "the shot sound starts no more than 17 ms (one 60 Hz frame) after the key press (journal 'at' minus key-press time, both on the page clock)"
    measured_by: "@kpi-K5 scenario 'A shot is heard in the same frame it is fired', every run in 3 engines"
    window: every run
    gate: hard
  - id: K6
    name: No performance cost
    target: "sound adds <= 0.5 ms frame work over the same stress run without sound: p95 in Chromium; mean in Firefox and WebKit (1 ms timers)"
    measured_by: "stress run with and without sound; tool = the spike script (git show 6801c46:.spike/measure/measure.js), adapted to the real game in slice 04"
    window: once per slice that adds sounds
    gate: soft
  - id: K7
    name: No errors
    target: "0 page errors or audio warnings; silent fallback when sound is unavailable or fails to start"
    measured_by: "@kpi-K7 scenarios, every run in 3 engines"
    window: every run
    gate: hard
  - id: K8
    name: Big moments land
    target: ">= 4 of 5 name the outcome (bonus, wave cleared, game over) from the jingle alone, eyes closed"
    measured_by: playtest task
    window: once, after slice 05
    gate: soft
  - id: K9
    name: Sound on by default is welcome
    target: "<= 1 of 5 say the sound bothered them or muted it for that reason"
    measured_by: post-session question
    window: once, before closing the feature
    gate: soft

  # rightmove-invaders-leaderboard, added by DEVOPS on 2026-10-24 and revised after the platform review (iteration 2):
  # operational contracts for the Score API on Netlify (legacy Free plan). Each row names its own feature; the top-level
  # `feature` above is the file's first one. scripts/smoke-leaderboard.mjs is specified in that feature's feature-delta.md
  # ("Wave: DEVOPS / [REF] CI/CD pipeline outline"). DELIVER wrote it (2026-10-25: 6f5be2d, revised in 78e0a0f), and it
  # has not run yet. It runs on a deploy preview before the first merge to main, with the user's OK to push. Its
  # write guard refuses any POST to a production host or to the published deploy, and any POST before an empty first GET.
  # Release-check triggers: a change to netlify/functions/scores.mjs, the @netlify/blobs version, the functions bundler
  # settings, config.rateLimit or the cache headers re-runs K10, K11 and K14.
  # local_scenarios (added by DISTILL, 2026-10-24): the @kpi-K… acceptance scenarios that check the same contract
  # locally, on the Blobs emulator, at the handler's level (project in-memory, tag @server). DELIVER enabled them
  # (2026-10-25), and they run in every Netlify build. They back a KPI; they never replace its
  # Netlify measurement, and the targets are unchanged. K10, K13 and K15 have no local scenario: they are
  # latency, deploy context and quota on Netlify itself (K13's chooseStore case table is a DELIVER unit test,
  # tests/unit/choose-store.spec.js).
  # baseline (added by DELIVER, 2026-10-25): what has been measured so far, and where. The targets are unchanged.
  # Nothing has been measured on Netlify yet: K10, K11, K12 and K14 wait for the preview smoke run, K13 for the first
  # production deploy with the function, and K15 for the first day after the merge. Pipeline baselines on the
  # developer machine, for the build-minute and release-check estimates: npm run build (bddgen, then the unit and
  # in-memory projects: 128 tests) takes about 2-3 s; npm test (326 tests, three browsers) takes about 14 min.
  - id: K10
    feature: rightmove-invaders-leaderboard
    name: Signing is quick on Netlify
    target: "p95 of POST + GET over 30 paced pairs on a deploy preview < 1000 ms, timed on the client (SPIKE budget); the cold start (the deploy's first request) is recorded as a separate sample, outside the p95. Amended by rightmove-invaders-replay-verified-scores (D21, user, 2026-10-26): from its slice 02, a POST that signs a 10-minute record replays it, so the budget is 1,750 ms, and the 10-minute replay's own p95 is under 650 ms, read by the owner from the log, not gated by the script (smoke steps S8 and S13; D21 as the user revised it after slice 02's preview, 2026-10-27, first 1,250 ms and 165 ms; corrected in DELIVER, 2026-10-27)"
    measured_by: "scripts/smoke-leaderboard.mjs preview run with --slice: S5 (--slice 01), S8 (--slice 02) and S13 (--slice 03), with each run's S1 as the cold start. Since rightmove-invaders-replay-verified-scores (DELIVER, 2026-10-27), a preview run needs --slice 01|02|03: the leaderboard's own run (steps 1 and 6) signed with no session, which the function refuses, and was retired"
    window: "the preview before the first merge to main; again on every release-check trigger"
    gate: hard
    baseline: "measured 2026-10-25 on deploy-preview-1 (PR #1, commit 4d0ac70), smoke preview run step 6: 30 sequential POST+GET pairs, all 200, p95 924 ms (max 1,049 ms, median about 780 ms): PASS, close to the 1 s budget. Cold start (step 1, first GET of a fresh deploy) 918 ms, measured separately. Re-run by rightmove-invaders-replay-verified-scores (DELIVER, 2026-10-27): S5 on deploy-preview-8 (slice 01, signings with sessions, no replay), p95 792 ms, cold start 2,660 ms; S8 on deploy-preview-9 (slice 02, 30 ten-minute records replayed), p95 1,459 ms (median 1,312 ms), over D21's first 1,250 ms and under its revised 1,750 ms, with the replay's p95 523 ms from the log; cold start 655 ms. S13 (slice 03) not run yet"
  - id: K11
    feature: rightmove-invaders-leaderboard
    name: No signature lost on real Netlify Blobs
    target: "on a throwaway preview whose only change removes the rate-limit rule (K11 measures Blobs under concurrency, not the rule; the rule is K14's): 20 simultaneous POSTs all answer 200 with their own ids; each POST whose score is in the true top 10 finds its own id in its answer; the next uncached GET equals the expected top 10 (0 lost). Only a 429 is inconclusive (the rule wasn't removed: fix the throwaway branch and rerun on a fresh preview; never a pass). Any other non-200 (503 not-saved, 500, ...) fails K11; the first result is recorded, and no rerun can turn it into a pass"
    measured_by: "scripts/smoke-leaderboard.mjs burst run with --slice 02, step S10 (S10.1-S10.3; S10.4-S10.5, the race, are K20's); the throwaway preview and its branch are deleted right after. Since rightmove-invaders-replay-verified-scores (DELIVER, 2026-10-27), a burst run needs --slice 02: the leaderboard's own burst run (steps 1-3) signed with no session, and was retired"
    window: "as K10"
    gate: hard
    local_scenarios: "@kpi-K11 'However many signatures arrive at once, none that belongs in the top ten is lost' (tests/e2e/rightmove-invaders-leaderboard/acceptance/milestone-3-no-signature-lost.feature): fast-check batches of up to 30 simultaneous signatures (the SPIKE's N = 100 was store-level evidence); every one answered 200 and the table read afterwards equals the true top 10. Not checked locally: each signer finding their own row in their own answer (the emulator can cut a listing short during concurrent writes), which stays K11's"
    baseline: "local twin only, measured 2026-10-25 (DELIVER, enabled in 6f5be2d): the @kpi-K11 property ran in 126 ms in the build gate (20 batches of up to 30 simultaneous POSTs, seed 20261023), with every POST answered 200 and 0 signatures lost from the top 10. Measured on Netlify by rightmove-invaders-replay-verified-scores (DELIVER, 2026-10-27), S10 on the throwaway deploy-preview-10 (draft PR #10, without the rate-limit rule; closed, its branch deleted): 20 sessions, then 20 signings of 20 scripted games at once, all 200, each in the true top 10 finding its own id; the GET 61 s later equals the true top 10: 0 lost. PASS"
  - id: K12
    feature: rightmove-invaders-leaderboard
    name: Previews never reach the production table, and the function bundle is complete
    target: "the write guard refuses every production host (the custom domain, <site>.netlify.app, main--<site>, any permalink outside the unpublished check) before any POST; a fresh preview answers {scores: []} and logs scope=deploy, context=deploy-preview, published=false (the published flag arrives from the Functions v2 Context); no preview id appears in a production GET; a POST with blocked initials gets 400 initials-not-allowed (proving the bundled src/game/high-scores.js)"
    measured_by: "scripts/smoke-leaderboard.mjs preview run with --slice: S1, S2, S4b and S6b (--slice 01; S6b is step 7, with --production), S9 and S9b (--slice 02), plus the preview's function log read by hand. Since rightmove-invaders-replay-verified-scores (DELIVER, 2026-10-27), a preview run needs --slice 01|02|03: the leaderboard's own run (steps 1, 4 and 7) signed with no session, and was retired"
    window: "as K10"
    gate: hard
    local_scenarios: "@kpi-K12 'Initials on the word filter are refused by the table too' (milestone-2-signing-the-table.feature): 400 initials-not-allowed and nothing saved, the local twin of smoke step 4: it proves the handler's refusal, not that the esbuild bundle includes src/game/high-scores.js (that is smoke step 4 on a preview). Preview isolation itself is Netlify's (chooseStore unit table, smoke steps 1 and 7)"
    baseline: "measured 2026-10-25 on deploy-preview-1 (PR #1, commit 4d0ac70): step 1, a fresh preview answered {scores: []} with 200; step 4, blocked initials got 400 initials-not-allowed (the bundle includes src/game/high-scores.js): PASS. Step 7 (no preview id in a production GET) SKIPPED: production answered 404, it has no function before the merge; rerun after the first production deploy with the function. The preview's function log line (scope=deploy, context=deploy-preview, published=false) is still to be read by hand. Locally the @kpi-K12 scenario is green (enabled in f91dc92). Re-run by rightmove-invaders-replay-verified-scores (DELIVER, 2026-10-27): on deploy-preview-8, S1 a fresh preview's {scores: []}, S2 a session (the bundle and the preview's secret), S4b initials-not-allowed with a session, S6b none of the run's ids on production; on deploy-preview-9, S9b initials-not-allowed again (the bundle with the rules) and the public test secret refused invalid-session. PASS"
  - id: K13
    feature: rightmove-invaders-leaderboard
    name: Only the published production deploy uses the site-wide store
    target: "one production GET /api/scores?table=<random> (GET only; a cache miss, so the function runs) logs scope=site, context=production, published=true; once there is an older production deploy with the function, the unpublished check (write guard: a permalink whose ID differs from the published deploy's ID, read from the Netlify API with the owner's token or confirmed by the owner typing it back after the script prints the target's ID, never from a command-line flag; and an empty first GET) POSTs once, answers 200, logs scope=deploy, context=production, published=false, and its id is absent from a production GET"
    measured_by: "scripts/smoke-leaderboard.mjs --production, and once --unpublished <permalink> (API route with NETLIFY_AUTH_TOKEN and --site-id, or interactive confirmation); then Netlify > Cloud compute > Functions > scores (retention unverified, so the same day); until the older deploy exists, the chooseStore unit table covers the unpublished case"
    window: "after every production deploy and every rollback, the same day; the unpublished check once, after the second production deploy with the function"
    gate: hard
    baseline: "measured 2026-10-25 after the first production deploy with the function (merge 144e23a): P1 production GET 200 at 18:02:58Z, and the function log shows scores.read with scope=site, context=production, published=true at 18:02:52, 18:02:53, 18:02:58 and 18:03:04 (PO read the log): PASS. The production table answered {scores: []}, so no preview signature reached it (K12 step 7: PASS). Observed: at 18:02:47 the first request to the new deploy logged scope=deploy, context=production, published=false, a few seconds before Netlify marked the deploy published; chooseStore fell back to the deploy store, as ADR-005 intends. Accepted residual risk (orchestrator, 2026-10-25): a signing within those few seconds of each production deploy or rollback lands in that deploy's store, not the shared table. The unpublished-permalink check waits for a second production deploy with the function"
  - id: K14
    feature: rightmove-invaders-leaderboard
    name: The rate limit and the GET cache hold on Netlify
    target: "on the shipped config: the deploy log lists the rule (10 per 60 s, ip + domain); steps 8a and 8b record the send rate actually achieved, and below 2 requests/s (8a) or 20 requests/s (8b) the step is inconclusive, never a pass; step 8a (2 requests/s for 125 s): a 429 within 16 s and at most 30 accepted in each full 60 s window (more than 20 is not a fail but triggers a documented recompute of the abuse table before the merge); step 8b (20 requests/s for 60 s, at most 1,200 invocations): a 429 within 11 s, and the count replaces the 10 + 10r assumption in the abuse table (a count above 210 is not a no-go: it triggers a documented recompute, and the user decides before the merge); a GET 61 s later is 200; a GET is a CDN hit within 15 s, also with an unrelated query string; no 429 is served from the cache. A missing Cache-Status header is a fail, not a vacuous pass; the header's real name is confirmed on the first preview. The first preview also records a function answer's full header set (a GET 200, a 400, a POST 200): exactly one Cache-Control value as in DDD-6, Netlify-Vary query=table present, and nothing conflicting with DDD-6 (the netlify.toml /* security headers are expected to be absent, since Netlify doesn't apply custom headers to function answers; if present, they are recorded and harmless)"
    measured_by: "scripts/smoke-leaderboard.mjs preview run with --slice 01, step S6 (steps 5, 8a, 8b, 8c, 8d and 9), plus the deploy log's post-processing stage. Since rightmove-invaders-replay-verified-scores (DELIVER, 2026-10-27), a preview run needs --slice: the leaderboard's own run signed with no session, and was retired. That feature's S6 added 8c, session requests at a session request every 4 s, faster than any player restarts (D19; corrected in DISTILL, 2026-10-27), and 8d, sessions and GETs alternating on the shipped config: one counter for both paths"
    window: "the preview before the first merge (go/no-go: no-go = no merge to main); again on every release-check trigger"
    gate: hard
    local_scenarios: "@kpi-K14 'An empty high-score table is read as empty, and everyone sees it at most 15 seconds old' (milestone-1-reading-the-table.feature) and 'A valid signature is saved, and the answer shows where it ranks' (milestone-2-signing-the-table.feature): the header set of a GET 200 (Netlify-CDN-Cache-Control public, s-maxage=15, durable; Cache-Control public, max-age=0, must-revalidate) and of a POST 200 (no-store), with Netlify-Vary query=table and nosniff; every refusal scenario checks no-store and Netlify-Vary too. The local check is at handler level: it proves what the function sets, not that Netlify honours it. The rate limit and the CDN's real behaviour stay K14's on a preview"
    baseline: "measured 2026-10-25 on deploy-preview-1 (PR #1, commit 4d0ac70): GO. Step 8a (2 requests/s achieved): first 429 after 6.0 s, at most 13 accepted in a 60 s window (no recompute). Step 8b (20 requests/s achieved): first 429 after 1.65 s, 78 accepted in 60 s, so one fast IP gets about 78 per minute (about 112k per day: the 125k quota in about 27 h, about 2.7 h after the 90% email), better than the 10 + 10r = 210 assumption; a GET 61 s later is 200. Step 5: GETs are CDN hits within 15 s (Cache-Status: 'Netlify Durable'/'Netlify Edge' hit, ttl 14); a different ?table= value is a deliberate miss. Step 9: cache hits count toward the rate limit, and no 429 was served from the cache. Header set of a GET 200, a 400 and a POST 200: one Cache-Control as in DDD-6, Netlify-Vary query=table, X-Content-Type-Options nosniff; the netlify.toml /* security headers are absent from function answers, as expected. Re-run by rightmove-invaders-replay-verified-scores on deploy-preview-8 (S6, slice 01, DELIVER, 2026-10-27): GO. 8a first 429 after 7.0 s, at most 16 accepted in a window; 8b 76 accepted at 20 requests/s, 200 again afterwards; 8c 11 accepted before the first 429 (at 44 s), 200 after 61 s; 8d 16 accepted in all, and 429 on both paths: one counter for /api/scores and /api/sessions; step 9 cache hits count toward the limit"
  - id: K15
    feature: rightmove-invaders-leaderboard
    name: Function invocations stay under half the free quota
    target: "< 62,500 invocations per calendar month (50% of the legacy Free 125k per site). The daily check records the cumulative Usage total daily and at every usage email; the day's rate is the difference between readings; if (125,000 - total) / rate puts 100% before the 1st of next month, the kill switch is pulled. Blobs: the account's Blobs limit and usage are recorded before the merge and in each daily check if visible; if none is visible, Blobs operations are recorded as an unmonitored residual risk"
    measured_by: "Netlify > Cloud compute > Functions > Usage (a cumulative count for the billing period; what it shows on legacy Free is recorded on day 1); Netlify's usage emails at 50/75/90/100%; the account's billing and usage pages for Blobs"
    window: "daily, on every usage email, and every few hours while abuse is suspected"
    gate: soft
    baseline: "none measured: the first reading is the Usage total on the first day after the merge"

  # rightmove-invaders-typed-initials, added by DISTILL on 2026-10-25 (DEVOPS was skipped: no new platform, server or
  # instrumentation). All four are soft gates: recorded and reviewed, not blocking the merge. on_miss says what a miss
  # triggers: a K16, K17 or K18 miss opens a fix via /nw-bugfix before the release record is written; a K19 miss means
  # investigate, then decide (the public table records no cause for an AAA row; DISCUSS, revised 2026-10-26 after the
  # second review cycle). An accidental skip (K18) is an Esc in game 1, when the player was asked to sign, or any skip the player calls
  # unintended; its exposure is every entry opened (n = 10 with 5 playtesters). Playtest protocol (K16-K18): 5 people
  # who match casual-arcade-player and aren't on the team, at least 1 of whom types on AZERTY or QWERTZ on their own laptop, play on
  # the pull request's deploy preview (its table starts empty, so any deposit makes it). Nobody is told how to sign or skip.
  # Each plays two games: after the first game over they sign; after the second they are asked to "move on without
  # putting your initials up". Times come from a screen recording, from the prompt appearing to "Signing …" or "Signing
  # skipped."; n is recorded with every result.
  # local_scenarios: the @kpi-K… acceptance scenarios that check the behaviour each KPI depends on, locally, in Chromium,
  # Firefox and WebKit. DELIVER enabled them (2026-10-26), and they are green in every npm test run (browser scenarios:
  # not in the Netlify build, which runs no browser). They back a KPI and never replace its playtest or production
  # measurement, and the targets are unchanged.
  # Measured so far (release, 2026-10-26): K19's baseline (below). K16-K18 not run: the PO merged without the playtest;
  # their baselines are the ones DISCUSS wrote. Pipeline baselines on the
  # developer machine: npm run build (the unit and in-memory projects) passes 159 tests; npm test passes 525 tests, in
  # 26.2 min (it was 326 tests and about 14 min before this feature).
  - id: K16
    feature: rightmove-invaders-typed-initials
    name: Signing is self-evident
    target: "5 of 5 playtesters whose deposit makes the table sign with their own initials, unaided, each within 10 s of the prompt"
    measured_by: "playtest screen recording and stopwatch (protocol above)"
    window: once, on the pull request's deploy preview, before closing the feature
    gate: soft
    on_miss: "a fix, opened via /nw-bugfix before the release record is written"
    local_scenarios: "@kpi-K16 'Typed initials sign the table' (milestone-1-typing-the-initials.feature) and 'Other initials sign after a refusal' (milestone-4-refused-initials.feature), in tests/e2e/rightmove-invaders-typed-initials/acceptance/"
    baseline: "not measured. Structurally, the letter wheel needs 9 presses for FAB and 17 for ALX (37 with Up only); typing needs 4"
  - id: K17
    feature: rightmove-invaders-typed-initials
    name: What you see is what you sign
    target: "0 signatures different from what the player meant, across all playtesters, the AZERTY or QWERTZ tester included"
    measured_by: "each playtester asked after each signing, checked against the preview table"
    window: as K16
    gate: soft
    on_miss: "a fix, opened via /nw-bugfix before the release record is written"
    local_scenarios: "@kpi-K17 'Fast typing keeps every letter, in order' (milestone-1), 'Game keys type their letters' (milestone-2), 'Letters on a French AZERTY keyboard' and 'Letters on a German QWERTZ keyboard' (milestone-3, synthetic key events: a real keyboard is DoD 5's manual check)"
    baseline: n/a
  - id: K18
    feature: rightmove-invaders-typed-initials
    name: Skipping is findable and safe
    target: ">= 4 of 5 playtesters asked to move on without signing skip with Esc, unaided, within 10 s; 0 accidental skips out of n entries opened (n = 10 with 5 playtesters)"
    measured_by: "playtest screen recording (protocol above)"
    window: as K16, with slice 02 on the preview
    gate: soft
    on_miss: "a fix, opened via /nw-bugfix before the release record is written"
    local_scenarios: "@kpi-K18 'Esc skips signing', 'Esc pressed as the game ends doesn't skip' and 'The invitation to sign says how to skip' (milestone-5-skip-with-esc.feature)"
    baseline: "today there is no way to skip"
  - id: K19
    feature: rightmove-invaders-typed-initials
    name: Fewer throwaway rows
    target: "no new AAA row on the production table in the 30 days after release. AAA rows are the proxy for throwaway signings: AAA is what the letter wheel signs when Enter is pressed three times just to get past the entry, and after release it has to be typed. A non-zero count means some players still sign AAA, either deliberately (their initials, or a joke) or because they wanted past the entry and didn't find Esc"
    measured_by: "GET /api/scores on production, weekly (public, read-only: no write guard needed)"
    window: "weekly for 30 days after the release that ships slice 02; the baseline on release day"
    gate: soft
    on_miss: "investigate, then decide. The investigation can ask the playtesters (did anyone want past the entry without finding Esc?), but the public table records no cause for an AAA row, so it can't say whether a production row was deliberate. The PO then decides whether a change is needed, and if so opens it via /nw-bugfix"
    local_scenarios: "@kpi-K19 'Esc skips signing' (milestone-5-skip-with-esc.feature): a skip sends nothing to the table. Observational in production (low traffic)"
    baseline: "0 AAA rows on the production top 10 on release day, 2026-10-26 (3 rows: ALF, CAR, FAB)"

  # rightmove-invaders-replay-verified-scores, registered by DEVOPS on 2026-10-26 (the feature delta's "Outcome KPIs"
  # and DEVOPS "Monitoring contracts"). The smoke steps S1-S13 are specified in that feature delta (DEVOPS, "Preview
  # smoke test, extended"); DELIVER implements them in scripts/smoke-leaderboard.mjs. DISTILL adds local_scenarios.
  # Release-check triggers grow: a change to anything the function bundles (src/game/**, src/theme/**,
  # netlify/scores/**) re-runs K10 and K22 on a preview. K10's budget for signings that replay is D21's: 1,750 ms, as the user revised it after slice 02's preview (2026-10-27; first 1,250 ms, measured 1,459 ms).
  - id: K20
    feature: rightmove-invaders-replay-verified-scores
    name: Forgeries are refused
    target: "11 of 11 forgeries in the catalogue refused with their reason, and 0 rows saved: (1) no session; (2) an altered session; (3) a game signed twice, with the same or another session; (4) an expired session; (5) a claimed deposit that isn't the replayed one; (6) a record that doesn't end at game over; (7) a malformed record; (8) a record over 60 minutes; (9) a record faster than the clock; (10) a body over the cap; (11) a deposit above 500000"
    measured_by: "the @server forgery catalogue in the build gate (the function's handler on a real Blobs emulator, item 4 on an injected clock; the Netlify entry is DELIVER's unit tests; corrected in DISTILL, 2026-10-27); on Netlify, smoke steps S4 (items 1-3), S9 and S10 (3, 5-8, 10, 11) and S11 (9), each in its slice's gate; the console forgery by hand on the preview (DoD)"
    window: "every build; each slice's preview"
    gate: hard
    local_scenarios: "@kpi-K20 (DISTILL, 2026-10-26, revised after the Final Wave Review Gate; @pending until DELIVER enables them, then in every Netlify build): the forgery catalogue at the handler (handleScores) on the Blobs emulator (tests/e2e/rightmove-invaders-replay-verified-scores/acceptance/, @server): (1) the walking skeleton 'The owner's table turns away a signing that no game asked for'; (2) milestone-2 'A session the table didn't seal is refused' x6; (3) milestone-2 'A game has one row on the table' x2 and the property 'nobody ever sees two rows for it'; (4) milestone-2 'A session lasts 2 hours' (2 h 1 min, on the harness clock; also 11 s in the future); (5) milestone-4 'A deposit the game didn't play to' x3 and 'A record made up by hand'; (6) milestone-4 'A record that stops a step before / goes on a step after its game over'; (7) milestone-4 'A record whose ... is refused before any replay' x7; (8) milestone-7 'A record of 60 minutes and one step'; (9) milestone-8 'A 20-minute game signed a minute after its session', the 10 s allowance x2, and '... even when the request asks for the local server's lenient clock'; (10) milestone-7 'A signing of 128 KB and one byte' and 'The table stops reading a signing soon after its limit' (the handler's own limit: on Netlify a body over 6 MB never reaches the function); (11) milestone-4 'The ceiling is checked on the claim' (£500,050). Each refusal checks its log reason, that the line gives nothing away, that nothing was saved, and, where it matters, that no replay ran. Plus the browser's own forgery, milestone-5 'A deposit changed on its way to the table is refused', in Chromium, Firefox and WebKit. They prove the handler, not the Netlify entry (DELIVER's unit tests) or Netlify itself (S4, S9-S12)"
    baseline: "2 of 11 refused before this feature (a body over the 1 KB cap; a deposit above the 250000 ceiling). Measured by DELIVER, 2026-10-27: 11 of 11 refused locally, with their reasons and nothing saved (the @server catalogue in every build; the browser's own forgery in three engines). On previews: deploy-preview-8 (slice 01), S4 items 1-3 (400 session-required; 400 invalid-session; 409 already-signed, with the same or another session; one row in all) and S4c's test route 404, no row; deploy-preview-9 (slice 02), S9 items 5-8, 10 and 11 (replay-mismatch x3, invalid-record, game-too-long, 413, implausible-score; nothing kept) and S9c's 7 MB body, 413 from Netlify before the function; deploy-preview-10, S10.4 three signings of one game at once, all 409, and no row for it (item 3). Item 4 is local only (an injected clock); item 9 on Netlify (S11) waits for slice 03's preview"
  - id: K21
    feature: rightmove-invaders-replay-verified-scores
    name: Honest games replay to their own deposit
    target: "0 mismatches over the recorded-games corpus (at least 6 bot games made in Node, from 1 minute to at least one of 15 minutes or more), replayed in Node and in Chromium, Firefox and WebKit, and over every signing of the browser acceptance suite (games played with the keyboard, replayed by the local function)"
    measured_by: "the recorded games signed through the table in the in-memory project (build gate) and in the browser projects (npm test); the browser scenarios' signings; the Netlify replays of smoke steps S7 and S8 on slice 02's preview"
    window: "every build and every npm test"
    gate: hard
    local_scenarios: "@kpi-K21 (DISTILL, 2026-10-26, revised 2026-10-27; @pending until E5 and slice 02; tag @corpus): milestone-6 'The table saves every recorded game at its recorded deposit, having played it back to its last step' (each signed through the table, project in-memory, the build gate: at least 6 games from about a minute to 15 minutes or more; one on other rules would be refused as such) and 'Every recorded game plays back as it was recorded, in this browser' (Chromium, Firefox, WebKit); 'A recorded game that now ends on another deposit / at another moment is refused by the table, by name' (the check itself); milestone-4 'An honest game's deposit is the deposit the table saves' and milestone-7 'The longest recorded game signs' (the function's replay of games played in Node); and every browser signing in the suite once slice 02 lands, milestone-3 'Typed initials sign the table through the game's own session' first (games played with the keyboard, replayed by the local function). The check only reads the corpus; node scripts/record-corpus.mjs records it and refuses to overwrite a game on the rules version the game plays now"
    baseline: "probe, 2026-10-26, on a patched copy of the rules: 7 of 7 games identical in Node 22, Chromium 151, Firefox 153 and WebKit 26.5. Measured by DELIVER, 2026-10-27, on the shipped rules: the corpus's 6 recorded games (rules version 1; 1.48 to 15.36 minutes, 10,627 to 110,583 steps, deposits of 7900 to 60050; 164,657 bytes) identical in Node, Chromium, Firefox and WebKit, and signed through the table at their recorded deposits in every build; every browser signing in npm test replayed by the local function (780 passed at 9977b14); on deploy-preview-9, S7's game and S8's 30 ten-minute games all replayed to their deposits and were saved: 0 mismatches"
  - id: K22
    feature: rightmove-invaders-replay-verified-scores
    name: A long game is verified in time on Netlify
    target: "on a deploy preview, the corpus's longest game (at least 15 minutes) signed with a session for its seed: answered 200 within 5 s on the client, and its replayMs (its scores.signed log line) recorded and scaled to 60 minutes of game time (its 1 s target dropped by the user after slice 02's preview, 2026-10-27: 1,299 ms for 110,583 steps, about 5 s scaled; a game near 60 minutes may end saved but unconfirmed, accepted, D21). A 60-minute worst-spacing body (about 119 KB) is posted too, for its upload and parsing time only: its junk inputs end the game early, so its replay is short"
    measured_by: "smoke step S7, and the owner reading the log line"
    window: "slice 02's preview, before the clock check lands; again on the release-check triggers (after slice 03, each session is asked at least its game's length ahead, 60 minutes for the 60-minute body)"
    gate: hard
    local_scenarios: "@kpi-K22 (DISTILL, 2026-10-26, revised 2026-10-27; @pending until E5 and slice 02): milestone-7 'The longest recorded game signs, and is saved with its deposit' (at least 15 minutes, with its scores.signed line's steps and replayMs) and 'The largest record a human could make in an hour is read and played back, not refused as too long' (about 119 KB: it shows the 60-minute record fits, not a 60-minute replay, since its made-up changes end the game within minutes). No local scenario plays back an honest 60-minute game: none exists to play. K22's 60-minute figure is S7's alone, scaled from the longest recorded game"
    baseline: "probe: about 50 ms for 10 minutes in Node 22 on an M4 Pro, so about 0.3 s for 60 minutes. Measured by DELIVER on deploy-preview-9 (slice 02, 2026-10-27), S7: the corpus's 15.36-minute game (110,583 steps) answered 200 in 1,753 ms on the client; its replayMs 1,299 (the first replay on a fresh instance; the handler took 1,465 ms), about 5.1 s scaled to 60 minutes: recorded, not gated (D21 as revised). The 60-minute worst-spacing body (119,009 bytes) was refused replay-mismatch in 459 ms on the client (replayMs 165, 4,441 steps). Not re-run after slice 03: S7 doesn't wait its game's length, so the re-run needs a new entry point (the owner's release check)"
  - id: K23
    feature: rightmove-invaders-replay-verified-scores
    name: Honest players are never refused, or the log says why
    target: "every replay-mismatch, too-fast, rules-changed and session-expired in the 30 days after slice 03's release is investigated; 0 traced to a determinism bug or a clock problem"
    measured_by: "the daily check: the counts by reason, with the deploy times, recorded in the owner's notes from the function's log (Netlify > Functions > scores, or netlify logs --function scores --since 24h), plus Netlify's own timeout lines for scores; a weekly summary"
    window: "daily from slice 01's release (session-expired exists from slice 01, replay-mismatch from slice 02) until 30 days after slice 03's release; the day-1 log-retention check is done before slice 03's release"
    gate: soft
    on_miss: "a fix, opened via /nw-bugfix"
    local_scenarios: "@kpi-K23 (DISTILL, 2026-10-26, revised 2026-10-27): milestone-8 'An honest game is never too fast' x3 (signed at once, a session 4 s late, a 10-minute pause; on the harness clock; @pending until slice 03) and milestone-9 'A record from other rules is refused without being replayed' (rules-changed, never mistaken for a forgery; @pending until slice 03). Run now, as a guard: milestone-8 'The browser's clock plays no part' x2 (a whole game in real time, the page's clock an hour fast or slow, no lenient clock, in Chromium, Firefox and WebKit), green today because there is no clock check yet, and kept green once there is. They back the target; the target itself is production's log"
    baseline: "0: none of these reasons exists before release. The window opened with slice 01's release (PR #8, merge 8305208, 2026-10-27: session-expired) and slice 02's (PR #9, merge babe1db, the same day: replay-mismatch); it runs until 30 days after slice 03's release, which waits for the user's OK (DELIVER, 2026-10-27)"
  - id: K24
    feature: rightmove-invaders-replay-verified-scores
    name: Forgers leave no row
    target: "0 rows on the production table that the owner judges forged in the 30 days after release, re-entered rows included (D7, D16)"
    measured_by: "GET /api/scores on production weekly (read-only); the owner's own notes of rows deleted, which are the only record of a row that came back (re-entry, D16); the log's refusals by reason"
    window: "weekly for 30 days after release"
    gate: soft
    on_miss: "investigate, then decide whether the accepted residual risk (ADR-012) needs more"
    baseline: "2026-10-26: 3 forged rows of about 9999950, deleted by the owner at S0 (count recorded by the owner, 2026-10-27, after slice 01's release). The production table after slice 01's release, 2026-10-27: 6 rows, then 7 after the owner's own test game; after slice 02's release, 8 after the owner's second test game. The 30-day window runs from the release (slice 01, PR #8, merge 8305208, 2026-10-27; DELIVER)"
  - id: K25
    feature: rightmove-invaders-replay-verified-scores
    name: A game's session comes back quickly
    target: "p95 of the session request (POST /api/sessions, timed on the client) under 1000 ms over 30 paced requests (one every 13 s) on a deploy preview; the first request of a fresh deploy recorded apart"
    measured_by: "smoke steps S2, S3 and S5's session phase"
    window: "slice 01's preview; again on the release-check triggers"
    gate: hard
    local_scenarios: "@kpi-K25 (DISTILL, 2026-10-26, revised 2026-10-27): milestone-1 'A game that starts gets its session and the table, in one answer' (the answer's shape, its no-store, its log line; @pending until slice 01). Run now, as a guard: milestone-3 'The game starts at once while the table answers its session request ...' x4 (at once, 3 s later, a failure, never), which backs only that the game never waits for its session: green today, when no session is asked for, and kept green once one is. Latency is not measured locally: K25's p95 is S2, S3 and S5's on a preview"
    baseline: "before this feature: the probe's /api/sessions (a fixed answer, no store) took 155-158 ms on deploy-preview-6, 2026-10-26. Measured by DELIVER on deploy-preview-8 (slice 01, 2026-10-27): S3, 30 paced session requests on a table of about 20 keys, p95 523 ms; S5's session phase on a nearly empty table, p95 616 ms; S2, the deploy's first session request, 189 ms (the deploy's cold start, 2,660 ms, was S1's GET): PASS. In production, the owner's two games got their sessions in 48 ms and 28 ms (the log's ms)"
