<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make the Right Move</title>
<link rel="icon" href="src/icons/favicon.ico" sizes="48x48 32x32">
<link rel="icon" href="src/icons/favicon-dark.ico" sizes="48x48 32x32" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/style.css">
<script type="module" src="src/main.js"></script>
</head>
<body>
<canvas id="game" aria-hidden="true"></canvas>

<section id="status" class="visually-hidden" aria-label="Game status">
  <h1>Make the Right Move</h1>
  <dl>
    <dt>Deposit saved</dt><dd data-hud="deposit">£0</dd>
    <dt>Property ladder</dt><dd data-hud="ladder">Studio flat</dd>
    <dt>Best deposit</dt><dd data-hud="best">£0</dd>
    <dt>Homes left</dt><dd data-hud="homes">3</dd>
    <dt>Sound</dt><dd data-hud="sound">On</dd>
    <dt>Music</dt><dd data-hud="music">On</dd>
  </dl>
  <p role="status" aria-live="polite" data-hud="announcement"></p>
  <h2 id="high-scores">High scores</h2>
  <ol aria-labelledby="high-scores" data-leaderboard></ol>
</section>

<footer class="site-footer">
  <p>Made with <span role="img" aria-label="love">❤️</span> with <a href="https://nwave.ai" target="_blank" rel="noopener">nwave.ai</a> · © 2026 <a href="https://fabiodamico.xyz" target="_blank" rel="noopener">Fabio D'Amico</a></p>
</footer>

<div id="no-keyboard">
  <div>
    <h2>Make the Right Move</h2>
    <p>This game needs a keyboard.<br>Open it on a laptop or desktop to play.</p>
  </div>
</div>
</body>
</html>
