# Journey SSOT. Created by DISCUSS for rightmove-invaders-sound, 2026-10-23 (lightweight depth).
# Extended by DISCUSS for rightmove-invaders-typed-initials, 2026-10-25: the high-score steps (qualify, type-initials,
# sign, see-the-table) and their error paths. The table itself shipped with rightmove-invaders-leaderboard, which had no
# DISCUSS. The high-score steps describe the entry as rightmove-invaders-typed-initials delivered it, both slices
# (DELIVER, 2026-10-26): the initials are typed, Backspace takes one back, Enter signs and Esc skips.
# Revised 2026-10-26, after the Final Wave Review Gate: the skip as its own branch of the sign step, feels on every error
# path, losing focus mid-entry, and the wording artifact's three owners. Revised again 2026-10-26, after the second
# review cycle: the losing-focus error path states that letters already typed stay (D20, locked by the user).
# Extended by DISTILL for rightmove-invaders-level-backdrops, 2026-10-26, with the user's approval (no DISCUSS ran): the
# neighbourhood behind each rung of the ladder in the start and outcome steps, and its shared artifact. This is the edit
# that feature's DESIGN recorded under Changed assumptions.
# Extended by DISCUSS for rightmove-invaders-replay-verified-scores, 2026-10-26: J-TABLE-TRUST; the start step asks for
# the game's session in the background; four error paths (no session, other rules, a page from before the release, an
# expired session); two shared artifacts (session, game_record). The player sees nothing new: every refused signing
# ends as "Couldn't confirm" (D5). Revised after the first review cycle (2026-10-26): the seed has one source, the session.
id: play-a-session
persona: casual-arcade-player
jobs: [J-SOUND-FEEDBACK, J-SOUND-TENSION, J-SOUND-CONTROL, J-SOUND-CELEBRATION, J-SOUND-ATMOSPHERE, J-TABLE-SIGN, J-TABLE-SKIP, J-TABLE-TRUST]

steps:
  - id: open
    action: Open the game in a desktop browser.
    sees: >
      Title screen with the hurdle legend, best deposit and controls (including "M sound"). While the shared high-score
      table is available, the title takes turns showing the legend and the High scores list.
    hears: Nothing yet. Browsers block audio until the first key press.
    feels: curious
  - id: start
    action: Press Enter.
    sees: >
      The formation and four terraced-house shields, at once, over the first rung's neighbourhood, City centre at dawn.
      In the background the game asks the high-score table for this game's session, and the answer also refreshes the
      table; nothing on screen waits for it (replay-verified-scores).
    hears: A "ding-dong" doorbell, then the marching beat (and music, if on).
    feels: engaged
  - id: fight
    action: Move with the arrows or A/D and fire with Space.
    hears: A "pew" per shot and a "pop" per hurdle hit (brighter for pricier hurdles), a thud when a house is hit, a "tink" when a shot meets a bolt.
    feels: in control, satisfied
  - id: pressure
    action: Keep clearing hurdles.
    hears: The beat speeds up as the formation thins and steps faster.
    feels: tense, focused
  - id: bonus
    action: Shoot the Dream Home as it crosses the top.
    hears: A warbling siren while it's on screen, then a "ka-ching" on the save.
    feels: delighted
  - id: lose-a-home
    action: Get hit by a bolt.
    hears: A falling explosion; the beat stops until the pin respawns.
    feels: setback, resolve
  - id: silence
    action: Press M (or N for the music only) when sound isn't welcome; press P or Esc, or switch window, to pause.
    sees: SOUND OFF (or MUSIC OFF) in the HUD; the setting is remembered next visit.
    hears: All game sound stops at once (or just the music).
    feels: in control
  - id: outcome
    action: Clear the wave, or lose.
    sees: >
      On "Wave cleared!", the next rung's neighbourhood fades in while the banner shows (Terraced streets in the morning
      after the city centre, and so on up to Seaside at night, which stays from Forever home on). Screen readers hear
      "Now on the property ladder at Terrace. Terraced streets in the morning." when the next wave starts.
    hears: A rising fanfare for "Wave cleared!", or a descending tune for "Offer rejected" / "Gazumped!".
    feels: proud, or wry and motivated to retry
  - id: qualify
    action: Lose with a deposit that makes the shared top 10, while the table is available.
    sees: >
      "Deposit saved £1,250", "New high score!", three empty slots (_ _ _) with the first blinking, and the help line
      "Type 3 letters   Enter sign   Backspace delete   Esc skip". Screen readers hear "New high score! Enter your
      initials: type 3 letters, then press Enter to sign. Esc skips." For the first 0.6 s no key acts on the entry, so
      a game key tapped as the game ends doesn't type.
    feels: proud, a little rushed
  - id: type-initials
    action: Type 3 letters (lowercase is fine, on any keyboard layout); Backspace deletes the last letter.
    sees: >
      Each letter fills the next slot, in capitals, as printed on the key (A _ _, A L _, A L X). Arrows, digits, Space and
      punctuation do nothing, and M, N and P type letters instead of toggling. Screen readers hear "A, letter 2 of 3" and
      so on, up to "A L X, press Enter to sign".
    feels: in control
  - id: sign
    action: Press Enter to sign, or Esc to pass (the skip branch below).
    sees: >
      "Signing ALX…", then "Signed ALX, #3." with the row marked (green on the canvas, marked as yours in the page), or
      "The table filled up before ALX arrived." or "Couldn't confirm ALX's signing."
    feels: proud, recognised
    branches:
      - id: skip
        action: Press Esc instead of Enter, at any point in the entry (empty, partly typed or full).
        sees: >
          "Signing skipped" where the signing line goes, then the High scores list, unchanged. Screen readers hear
          "Signing skipped. Press Enter to house-hunt again." Nothing is sent, the deposit stays off the table, and an
          earlier signing keeps its mark.
        feels: relieved, unbothered, free to play on
  - id: see-the-table
    action: Press Enter to house-hunt again; open the game later, or on another computer.
    sees: >
      The High scores list on every game-over screen and on the title, refreshed at each game start. ALX's confirmed row
      stays marked until the next signing, or until it leaves the table.
    feels: motivated to climb

shared_artifacts:
  sound_enabled: {source: "g.settings.sound (rules), persisted by main.js in localStorage 'make-the-right-move:sound'", default: true, toggled_by: M}
  music_enabled: {source: "g.settings.music (rules), persisted by main.js in localStorage 'make-the-right-move:music'", default: true, toggled_by: N}
  formation_step: {source: "formationStepped event from the rules (src/game/events.js)", drives: marching beat tempo}
  game_events: {source: "the rules' event outbox, takeEvents() (ADR-001); vocabulary in src/game/events.js", drives: effects and jingles}
  high_score_table: {source: "the Score API /api/scores (netlify/functions/scores.mjs over Netlify Blobs), held by the rules as g.table", consumers: [game-over list, title attract list, status mirror High scores list]}
  initials_entry: {source: "g.initials (rules)", consumers: [canvas slots, "data-hud=initials field", live region]}
  session: {source: "the Score API's session request at each game start (replay-verified-scores, D2, D3): the game's seed and its issue time, signed by the function; the only source of the seed the replay uses", consumers: [the signing of that game, the Score API's replay]}
  game_record: {source: "the rules, from the game's start to its game over: the held controls (left, right, fire) by step index, and the rules version; never the seed, which comes from the session alone (replay-verified-scores)", consumers: [the signing of that game, the Score API's replay]}
  signing: {source: "g.signing and g.settled (rules)", consumers: [canvas signing line, live region, "the row marked as yours"]}
  neighbourhood: {source: "NEIGHBOURHOODS in src/theme/theme.js, through neighbourhood(g.level)", consumers: [canvas backdrop, "data-hud=neighbourhood field", arrival sentence]}
  wording: {source: "src/view/messages.js (the phrases both views say), src/view/status.js (status mirror only, such as the prompt and the initials field) and src/view/render.js (canvas only, such as the slots and the help line)", consumers: [canvas, status mirror]}

error_paths:
  - when: No key pressed yet (autoplay policy).
    then: The game is silent; the first key press unlocks audio. No console errors.
    feels: unaware, nothing seems wrong
  - when: The browser has no Web Audio support or it fails to start.
    then: The game plays silently; nothing else changes.
    feels: unbothered, the game still plays
  - when: Many sounds at once (40 bolts hitting shields).
    then: Overlapping voices are capped; the oldest is dropped; no clipping.
    feels: immersed, never deafened
  - when: The window loses focus, the tab is hidden or the game is paused.
    then: All sound stops at once, without waiting for the next frame; it resumes when play resumes.
    feels: in control
  - when: localStorage is blocked.
    then: Sound and music default to on for every visit.
    feels: mildly put out, if they had muted last visit
  - when: The initials typed are on the word filter (for example ASS).
    then: '"Those initials aren''t allowed. Type different ones."; the slots empty; nothing is sent.'
    feels: caught out, then amused, and tries again
  - when: Enter is pressed with fewer than 3 letters.
    then: '"Type 3 letters to sign, or press Esc to skip."; the letters stay; nothing is sent.'
    feels: briefly unsure, then guided
  - when: A game key is tapped just as the game ends.
    then: For the first 0.6 s of game over no key acts on the entry, and a key held down from play never types.
    feels: safe, no stray letter on a public table
  - when: The window loses focus or the tab is hidden while the initials are being typed.
    then: The entry stays open; letters already typed stay; nothing is typed while the window lacks focus.
    feels: reassured, nothing lost
  - when: The table has never loaded by game over (unreachable at page load).
    then: No initials are asked; game over says "High-score table unavailable." and the game plays on.
    feels: a little let down, still playing
  - when: A refresh fails after a table has loaded.
    then: The last good table stays, and a deposit that makes it is still asked for initials.
    feels: unaware, nothing changes for them
  - when: The signing doesn't get through (connection lost, turned away, or no answer within 5 s).
    then: '"Couldn''t confirm ALX''s signing." It is never retried; if it was saved, the next refresh shows the row, unmarked.'
    feels: let down, but told plainly
  - when: The table filled up before the signing arrived.
    then: '"The table filled up before ALX arrived."'
    feels: unlucky, keen to try again
  - when: The game's session never arrived (the request failed, or no answer within 5 s).
    then: 'The game plays as usual; a deposit that makes the table is still asked for initials, and the signing ends "Couldn''t confirm ALX''s signing." (replay-verified-scores, D11).'
    feels: let down, but told plainly
  - when: A deploy changed how the game plays while the page was open.
    then: 'The next signing ends "Couldn''t confirm ALX''s signing."; after a reload, games sign as usual (replay-verified-scores, D10).'
    feels: puzzled, until the reload
  - when: The page was loaded before the release that verifies games, and is still open.
    then: 'Its signing ends "Couldn''t confirm ALX''s signing."; the release note says to reload, and after a reload games sign as usual (replay-verified-scores, D5, D12).'
    feels: puzzled, until the reload
  - when: A game was left paused for so long that its session, issued at its start, is more than 2 hours old.
    then: 'The game plays on; its signing ends "Couldn''t confirm ALX''s signing." (replay-verified-scores, D18).'
    feels: mildly put out, after a very long pause
