# environments.yaml: machine artifact of the DEVOPS wave for rightmove-invaders-sound (2026-10-24).
# Static site on Netlify; the narrative is in feature-delta.md under "Wave: DEVOPS".

target_environments:
  - name: production
    description: "Live game. Netlify builds and publishes every push to main."
    url: https://maketherightmove.fabiodamico.xyz
    platform: [netlify-static]
    deploy_trigger: "push to main"
    preconditions:
      - "Netlify site linked to github.com/lagom1985/rightmove-space-invaders (one-time, by the owner)"
      - "custom domain maketherightmove.fabiodamico.xyz added in Netlify; DNS record and Let's Encrypt certificate are automatic (fabiodamico.xyz uses Netlify DNS)"
  - name: deploy-preview
    description: "Netlify deploy previews for pull requests and branches, built with the same netlify.toml. Not the production URL."
    url: "generated by Netlify per deploy (https://deploy-preview-<n>--<site>.netlify.app)"
    platform: [netlify-static]
    deploy_trigger: "pull request or branch push"
    preconditions:
      - "same Netlify site as production"
  - name: local
    description: "Developer machine: play with npm start; run the full suite with npm test."
    url: http://localhost:4173
    platform: [macos, linux]
    preconditions:
      - "Node 22 and npm install"
      - "npx playwright install (first time, for the chromium, firefox and webkit projects)"

# DISTILL's player-state variants (see its Pre-requisites). They apply to every target environment above.
distill_environment_mapping:
  clean: "first visit: no localStorage settings (includes the walking skeleton)"
  with-stale-config: "saved sound and music settings in localStorage (milestones 2 and 7)"
  with-pre-commit: "not applicable: no install step and no git hooks"

platform_coverage:
  desktop_browsers:
    Chrome: [current]
    Edge: [current]
    Firefox: [current]
    Safari: [current]
  tested_by: "Playwright 1.62.1 desktop Chrome, Firefox and Safari (WebKit) devices; real Safari is a manual check (D10)"
  not_supported: "phones and narrow windows (the game needs a physical keyboard; they get a 'play on desktop' screen)"
  runtime:
    Node: ["22 (local; NODE_VERSION in netlify.toml)"]
    build: "Netlify build image"

coexistence_matrix:
  - tool: playwright
    version: "@playwright/test 1.62.1"
    must_not_break: true
    note: "dist/ holds only index.html and src/; tests/ and scripts/serve.mjs are untouched, and npm start still serves the repo root"
  - tool: playwright-bdd
    version: "9.2.1"
    must_not_break: true
    note: "the build gate runs bddgen first; .features-gen/ stays ignored by git"
  - tool: fast-check
    version: "4.10.2"
    must_not_break: true
    note: "unit properties run in the build gate (project unit)"
  # Nothing else: no husky, pre-commit, GitHub Actions or containers in this repo.

deployment_assumptions:
  - "Static files only: no server, no functions, no database, no secrets or environment variables beyond NODE_VERSION"
  - "Atomic: Netlify publishes a deploy only after the build succeeds; a failed build leaves the previous deploy live"
  - "Idempotent: building the same commit twice gives the same dist/; scripts/build.mjs cleans dist/ first"
  - "Rollback: Netlify Deploys > a previous deploy > Publish deploy (no rebuild, no code change)"
  - "Build gate: bddgen + Playwright projects unit and in-memory (no browsers) run before dist/ is built; browser projects and K5/K7 run locally with npm test"
  - "No personal data and no cookies; the only third-party request is the Google Fonts stylesheet and font"
