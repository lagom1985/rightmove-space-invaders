schema_version: '0.1'
outcomes:
- id: OUT-1
  kind: operation
  summary: Sound director returns the sound cues for each game event
  feature: rightmove-invaders-sound
  inputs:
  - shape: game event {type, t, ...detail}
  output:
    shape: 'Cue[] returned (no synth reference): {op: play|startLoop|stopLoop|startMusic|stopMusic|silence,
      sound?, detail?, t}'
  keywords:
  - sound
  - director
  - game-event
  - cue
  - handle
  artifact: src/sound/director.js
  related: []
  superseded_by: null
- id: OUT-2
  kind: operation
  summary: Read-only audio diagnostics handle window.makeTheRightMove.audio
  feature: rightmove-invaders-sound
  inputs:
  - shape: none (read-only)
  output:
    shape: '{state: locked|running|suspended|unavailable, journal: [{sound, detail,
      t, at}], music: playing|stopped, voices, peakVoices}, frozen copies, no functions'
  keywords:
  - audio
  - diagnostics
  - journal
  - sound-log
  - state
  artifact: src/sound/synth.js
  related: []
  superseded_by: null
- id: OUT-3
  kind: invariant
  summary: No sound while muted or paused
  feature: rightmove-invaders-sound
  inputs:
  - shape: any game event sequence while sound is off or the game is paused
  output:
    shape: no sound started, no loop or music playing
  keywords:
  - mute
  - pause
  - silence
  - sound-off
  artifact: src/sound/director.js
  related: []
  superseded_by: null
- id: OUT-4
  kind: specification
  summary: House-hit sound rate limit
  feature: rightmove-invaders-sound
  inputs:
  - shape: shieldHit events at simulation times t1..tn
  output:
    shape: thuds at least 0.05 s apart, greedy (none dropped needlessly)
  keywords:
  - rate-limit
  - shield-hit
  - house-hit
  - thud
  artifact: src/sound/director.js
  related: []
  superseded_by: null
- id: OUT-5
  kind: invariant
  summary: Voice cap
  feature: rightmove-invaders-sound
  inputs:
  - shape: any burst of sounds
  output:
    shape: at most 8 effect voices sounding at once; oldest cut first
  keywords:
  - voice-cap
  - polyphony
  - overlap
  artifact: src/sound/synth.js
  related: []
  superseded_by: null
- id: OUT-6
  kind: operation
  summary: Sound and music toggles
  feature: rightmove-invaders-sound
  inputs:
  - shape: key M or N in any game state
  output:
    shape: sound/music setting toggled, persisted in localStorage, shown in HUD and
      announced
  keywords:
  - mute-key
  - m-key
  - n-key
  - music-toggle
  - settings
  - persist
  artifact: src/game/game.js
  related: []
  superseded_by: null
- id: OUT-7
  kind: operation
  summary: Score API reads the shared high-score table
  feature: rightmove-invaders-leaderboard
  inputs:
  - shape: 'GET /api/scores, no body'
  output:
    shape: '200 {scores: [{initials, score, id}], listedAt}, best first, at most 10, listedAt
      = the function''s Date.now() in ms taken right after its list call returns; amended
      in DEVOPS (user, 2026-10-24): the 200 is cached at the CDN for 15 s (Netlify-CDN-Cache-Control
      public, s-maxage=15, durable; Cache-Control public, max-age=0, must-revalidate;
      Netlify-Vary query=table), so an answer can be up to 15 s old and carries the listedAt
      of its own listing; a failed listing gives 500 unexpected with Cache-Control no-store;
      the read path receives only the list operation of the restricted table-store port,
      so the store is unchanged'
  keywords:
  - high-score-table
  - leaderboard
  - score-api
  - read-table
  - top-ten
  artifact: netlify/functions/scores.mjs
  related: [OUT-10, OUT-13]
  superseded_by: null
- id: OUT-8
  kind: operation
  summary: Score API signs the shared high-score table
  feature: rightmove-invaders-leaderboard
  inputs:
  - shape: 'POST /api/scores, content-type application/json, body read with a 1 KB byte
      cap, exactly {initials, score}'
  output:
    shape: '200 {scores, id, listedAt} with id = the new row and listedAt = the function''s
      Date.now() in ms taken right after the listing that follows the write (also when
      best-effort pruning failed); function errors are JSON {error}: 415 json-required
      (content type), 413 payload-too-large (over 1 KB), 400 invalid-signature (any other
      shape error) or initials-not-allowed, 405 method-not-allowed with Allow: GET, POST (clarified in DISTILL), 503 not-saved, 500 unexpected
      (including a port refusal of a key that is not well-formed); every answer from the
      function other than a GET 200 is no-store, and every answer carries Netlify-Vary
      query=table. 429 comes from Netlify only, above 10 requests per 60 s per IP and
      domain (its body and headers, no no-store guarantee; amended in DEVOPS, user,
      2026-10-24). The client distinguishes only OK from not OK'
  keywords:
  - sign-table
  - signature
  - submit-score
  - score-api-errors
  - initials
  artifact: netlify/functions/scores.mjs
  related: [OUT-9, OUT-10, OUT-13]
  superseded_by: null
- id: OUT-9
  kind: invariant
  summary: No signature is lost when players sign at the same moment
  feature: rightmove-invaders-leaderboard
  inputs:
  - shape: N valid signatures posted at once (verified up to N = 100 at store level in the SPIKE; the local acceptance property caps at 30 per batch and checks the table read afterwards; each signer finding their own row in their own answer is checked on Netlify by K11, because the emulator can cut a listing short during concurrent writes; clarified in DISTILL)
  output:
    shape: 'every saved signature that belongs in the true top 10 is in the table; through
      the restricted table-store port (list, putIfNew, remove of well-formed keys only,
      no deleteAll) each POST adds one well-formed key under s/ and deletes, best-effort, k = min(5, n - 20) well-formed keys ranked 11th or lower, n being the well-formed keys in the listing after its write, and none unless n is above 20 (exact rule accepted: user, 2026-10-24);
      other keys are never touched'
  keywords:
  - no-lost-score
  - concurrent-signing
  - one-key-per-score
  - bounded-prune
  artifact: netlify/functions/scores.mjs
  related: [OUT-8]
  superseded_by: null
- id: OUT-10
  kind: specification
  summary: Shared signature validity (browser and function) and browser-side qualification
  feature: rightmove-invaders-leaderboard
  inputs:
  - shape: 'table state {status: unknown|available|unavailable, rows: [{initials, score,
      id}] best first}, deposit; signature {initials, score}'
  output:
    shape: 'makesTheTable (browser only) = status available and deposit > 0 and (fewer
      than 10 rows or deposit above the 10th; a tie misses). Valid signature shape (isValidSignature, browser and function) = exactly {initials, score}, initials of 3 letters A-Z, score a positive integer multiple of 50 up to 9999999; allowed initials (isAllowedInitials) = not on the word filter. The browser needs both; the function maps a bad shape to 400 invalid-signature and blocked initials to 400 initials-not-allowed (clarified in DISTILL). The function never decides qualification'
  keywords:
  - qualification
  - makes-the-table
  - signature-validity
  - word-filter
  - high-score-rules
  artifact: src/game/high-scores.js
  related: [OUT-8, OUT-11]
  superseded_by: null
- id: OUT-11
  kind: specification
  summary: Signing outcome lifecycle
  feature: rightmove-invaders-leaderboard
  inputs:
  - shape: 'Enter with 3 typed letters on the initials entry (amended by typed-initials, DISTILL 2026-10-25; was:
      third Enter on the initials entry); the answer (with its rows and listedAt),
      failure or 5000 ms timeout of signing n; Enter'
  output:
    shape: 'blocked initials keep the entry open, emptied, with the refusal shown until the next key the entry acts on
      (amended by typed-initials; was: the letters kept); allowed initials -> pending (signing
      n, replacing any earlier signing as the current one) -> confirmed (rank from the
      answer''s own rows; row highlighted wherever the table is shown (not the title: clarified in DISTILL) until the next
      signing or until the row leaves the shown table, pruned or pushed down, while
      the signing stays confirmed) | off-table | unconfirmed ("Couldn''t confirm FAB''s
      signing": it may have been saved; any not-OK answer, 429 included); a new game
      keeps the signing and an outcome
      arriving during play is announced by the status mirror only; the answer or failure
      of a replaced signing is announced once through the status mirror, its rows apply
      under the listedAt rule, and it changes neither the current signing nor its highlight;
      no POST retry; Enter starts a new game from any settled or pending status'
  keywords:
  - signing-outcome
  - signing-lifecycle
  - pending-signature
  - late-answer
  - initials-refused
  artifact: src/game/game.js
  related: [OUT-10, OUT-12]
  superseded_by: null
- id: OUT-12
  kind: specification
  summary: High-score table status and degradation
  feature: rightmove-invaders-leaderboard
  inputs:
  - shape: 'loads on page load and on every game start, plus POST answers, each answer
      with rows carrying listedAt (server listing time, ms); each succeeds or fails (non-OK,
      network error, 5000 ms timeout)'
  output:
    shape: 'one table state {status, rows}: unknown until the first answer; available
      after a successful load or POST answer, whose rows apply only if listedAt >= the
      last applied listedAt (otherwise ignored; accepted edge: clock skew of a few ms
      between function instances can misorder two nearly identical listings); unavailable
      only while no table has ever loaded (a failed refresh keeps the last good table;
      a late failed load after a success changes nothing); the table is as old as the
      last successful refresh; initials asked only when makesTheTable (status available);
      game over shows the list (available), "High-score table unavailable" (unavailable),
      or no prompt, no list and no table line (unknown); the frame never waits on the
      network'
  keywords:
  - table-status
  - table-unavailable
  - degradation
  - refresh-on-start
  - offline-play
  artifact: src/game/game.js
  related: [OUT-10, OUT-11]
  superseded_by: null
- id: OUT-13
  kind: invariant
  summary: Only the published production deploy uses the production high-score store
  feature: rightmove-invaders-leaderboard
  inputs:
  - shape: any request to /api/scores in deploy context c, with published flag p
  output:
    shape: 'chooseStore(context) = site only when context?.deploy?.context === production
      (case-sensitive) and context?.deploy?.published === true (amended in DEVOPS, user,
      2026-10-24), else deploy (production with published false, missing or not a boolean,
      deploy-preview, branch-deploy, dev, missing deploy, missing context, Production);
      so an older production deploy reached through its permalink writes its own deploy
      store, and a rollback makes the newly published deploy write the site store; site
      -> getStore leaderboard, deploy -> getDeployStore leaderboard; a deploy store without
      a deploy ID (MissingBlobsEnvironmentError) -> 500 unexpected, never the site store;
      locally (scripts/serve.mjs) one store per test-board cookie, scope local; every
      log line carries scope, the raw context and the raw published flag'
  keywords:
  - deploy-context
  - deploy-store
  - preview-isolation
  - production-table
  artifact: netlify/functions/scores.mjs
  related: [OUT-7, OUT-8]
  superseded_by: null
- id: OUT-14
  kind: specification
  summary: Accessible initials entry and signing outcomes in the status mirror
  feature: rightmove-invaders-leaderboard
  inputs:
  - shape: 'the game state g read each frame: the initials entry {letters, notice} and the skip flag (amended by
      typed-initials, DELIVER 2026-10-26; was: {letters, index}), the
      current signing {initials, status, id, rank}, the latest settled outcome {n, initials,
      outcome, rank}, the table {status, rows}'
  output:
    shape: 'data-hud=initials field reads "No letters yet, letter 1 of 3", "A, letter 2 of 3", "A L, letter 3 of 3"
      or "A L X, press Enter to sign" while entering (empty otherwise); at most one live-region write per frame, so
      letters typed within one frame are announced together, as the field they leave; each notice once, by its number,
      even when its words repeat (amended by typed-initials, DISTILL 2026-10-25; was: "F A A, letter 2 of 3", one update
      per change of letter or position, same-key presses within a frame count once, and "Those initials aren''t allowed.
      Change a letter."); the messages DISTILL fixed (Signing FAB…, Signed FAB, #3., The table filled up before FAB
      arrived., Couldn''t confirm FAB''s signing., Those initials aren''t allowed. Type different ones., Type 3 letters to
      sign, or press Esc to skip. (slice 01: Type 3 letters to sign.), Signing skipped. Press Enter to house-hunt again.,
      High-score table unavailable.); the prompt New high score! Enter your initials: type 3 letters, then press Enter to
      sign. Esc skips. (slice 01: without Esc skips.); each settled outcome announced once whenever it arrives, a replaced
      signing''s included; aria-current=true on the current confirmed signing''s row in the
      High scores list while that row is shown; a later game''s game-over message never
      repeats an earlier outcome'
  keywords:
  - accessibility
  - initials-field
  - live-region
  - aria-current
  - signing-announcement
  artifact: src/view/status.js
  related: [OUT-11, OUT-12, OUT-15, OUT-16, OUT-18]
  superseded_by: null
- id: OUT-15
  kind: specification
  summary: 'Typed initials entry: letters as printed, every press in order, the stray-key guard, the suspended
    game keys, the emptied refusal'
  feature: rightmove-invaders-typed-initials
  inputs:
  - shape: 'each frame while the initials entry is open: handlePresses(pressed, typed), typed = the keydowns since
      the last frame in order, each { key }, without repeats or Cmd/Ctrl/Alt chords (ADR-009); the game-over
      time overT'
  output:
    shape: 'while overT <= 0.6 every key of the frame is dropped; otherwise the typed presses in order: a key that is
      exactly one ASCII letter a-z or A-Z (no normalisation, no case folding: ß, ı, ſ, K (Kelvin), é and a decomposed é
      are ignored) fills the next of 3 slots in capitals and clears the notice, a 4th is ignored; Backspace removes the
      last letter (nothing on an empty entry); Enter with 3 allowed letters signs exactly them (initialsEntered, the
      OUT-11 lifecycle unchanged) and drops the rest of the frame; Enter with 3 letters on the word filter empties the
      entry and shows the refusal notice; Enter with fewer shows the too-few notice and keeps the letters; each notice
      is numbered n, so a repeated one is announced again; any other key changes nothing, the notice included; the
      positional set is ignored in such a frame (no M/N toggle, no pause, no restart); the entry opens empty;
      snapshot().entry = { letters, notice: null | { kind: refused | too-few, n } } (settled in DISTILL)'
  keywords:
  - typed-initials
  - initials-entry
  - key-order
  - stray-key-guard
  - keyboard-layout
  artifact: src/game/game.js
  related: [OUT-10, OUT-11, OUT-14, OUT-16]
  superseded_by: null
- id: OUT-16
  kind: operation
  summary: Skip signing with Esc
  feature: rightmove-invaders-typed-initials
  inputs:
  - shape: Esc in a frame that starts with the initials entry open, with overT > 0.6
  output:
    shape: 'the entry closes and this game over is marked skipped (snapshot().skipped true until the next game starts;
      settled in DISTILL); no signing, no initialsEntered event, no request, no sound; the current signing, its mark,
      the settled notice, the table and the best are unchanged; the rest of the frame is dropped; the status mirror says
      "Signing skipped. Press Enter to house-hunt again."; Enter then starts a new game as usual'
  keywords:
  - skip-signing
  - esc
  - initials-entry
  - no-signing
  artifact: src/game/game.js
  related: [OUT-11, OUT-15]
  superseded_by: null
- id: OUT-17
  kind: invariant
  summary: 'Backdrop legibility: a luminance cap on the neighbourhood palettes and
    a contrast need per foreground use'
  feature: rightmove-invaders-level-backdrops
  inputs:
  - shape: 'the six NEIGHBOURHOODS palettes (nine colours each) and the foreground
      uses of DESIGN''s Legibility needs table: COLORS.dim, text, green and dream
      (text), the five HURDLES colours, brick and window (objects), the hurdle names
      in the title legend'
  output:
    shape: every palette colour has WCAG relative luminance <= 0.05; every use meets
      its need (4.5:1 for dim, text, green and dream; 3:1 for the hurdle colours,
      brick and window) against every palette colour with its luminance raised by
      0.001, checked over every pair in plain loops; the title legend's hurdle names
      meet 4.5:1 against City centre at dawn's palette, Gazumper's held to 3:1; COLORS.door
      and COLORS.danger are excused by name with their reasons; every colour drawn
      over a backdrop (COLORS and the hurdles') is measured against its strictest
      need and meets it, or is excused by name, never both or neither
  keywords:
  - backdrop-legibility
  - palette-luminance-cap
  - contrast-need
  - wcag-contrast
  artifact: src/theme/theme.js
  related: [OUT-19]
  superseded_by: null
- id: OUT-18
  kind: specification
  summary: A neighbourhood for every rung of the property ladder, faded in during
    Wave cleared!
  feature: rightmove-invaders-level-backdrops
  inputs:
  - shape: each frame's { level, state, banner } (the pause is handed over too and
      ignored); the status mirror synced each frame from g
  output:
    shape: 'backdropPlan(frame) -> { here, next, mix }: here = neighbourhood(level),
      clamped at Forever home; while state is clear and level < 5, next = neighbourhood(level
      + 1) and mix = 1 - banner / BANNER_TIME clamped to [0, 1]; otherwise next null
      and mix 0 (title, play, dead, over, clear at Forever home or past it, paused
      as the state underneath, a new game at once on City centre at dawn). data-hud=neighbourhood
      reads neighbourhood(level).name; the live region says ''Wave cleared! Moving
      up the ladder to {rung}.'' on a clear, then, once, ''Now on the property ladder
      at {rung}. {name}.'' at the start of every wave after a clear, the repeats from
      Forever home onwards included (revised in DISTILL revision 1, F4); never on
      resuming or respawning, and never on a new game, which says only ''Game started.
      Defend your dream home from the hurdles.''; LADDER and NEIGHBOURHOODS pair
      one to one, six different names on each side'
  keywords:
  - neighbourhood
  - backdrop-crossfade
  - ladder-rung-place
  - arrival-sentence
  artifact: src/view/backdrop.js
  related: [OUT-14, OUT-19]
  superseded_by: null
- id: OUT-19
  kind: invariant
  summary: Backdrops are seeded, palette-only, never rebuilt while held at their scale,
    and fail safe
  feature: rightmove-invaders-level-backdrops
  inputs:
  - shape: paintBackdrop(context, neighbourhood) on any 2D context; createBackdropCache(createCanvas)
      with rescale(k) and canvasFor(neighbourhood), over a canvas factory whose getContext
      may return null or whose draws may throw; showBackdrop(context, plan, canvasFor)
      on the screen's context, handed the store's canvasFor alone
  output:
    shape: painting never calls Math.random, makes the same calls every time, sets
      only its palette's colours and COLORS.green, and draws streets (road colour)
      and a skyline (sky colour); the cache never rebuilds a backdrop it holds at its scale
      (a neighbourhood dropped from the two is built again when next asked for), builds
      at round(W*k) by round(H*k) with the scale set (setTransform(k, 0, 0, k, 0, 0))
      before anything is drawn, keeps the two most recently asked for (the least recently
      asked for goes first), and returns that neighbourhood's own canvas; a build with a null context or a throwing draw makes canvasFor return
      null, throws nothing, logs nothing, and is not retried until the next change
      of scale (rescale with a new k; the same k changes nothing, built or failed;
      revised in DISTILL revision 1, M-2); failed marks don't count towards the two
      and are never evicted; a failed rung doesn't stop the next one; showBackdrop
      asks for here, then for next whenever the plan names one, draws here at full
      strength and next at globalAlpha = mix, a null canvas as a fillRect in that
      palette's bg at the same strength (never drawImage(null)), each over 0, 0,
      W, H, and puts globalAlpha back; over a game, builds happen only on the title's
      first frame, the first frame of each Wave cleared! below Forever home, the
      first frame of a new game, and the first frame after a change of scale
  keywords:
  - backdrop-determinism
  - seeded-backdrop
  - no-math-random
  - backdrop-fail-safe
  artifact: src/view/backdrop.js
  related: [OUT-17, OUT-18]
  superseded_by: null
