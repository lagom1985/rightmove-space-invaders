# KPI contracts SSOT. Created by DISTILL for rightmove-invaders-sound, 2026-10-23 (revision 3).
# DEVOPS was skipped, so DISTILL defines the contracts from DISCUSS's outcome KPIs.
# gate: hard = must pass before the feature is done; soft = recorded and reviewed, not blocking.
# Playtest protocol (K1-K4, K8, K9): 5 people matching casual-arcade-player, not on the team; three waves
# each: waves 1-2 one muted and one with sound (order alternated between people), wave 3 with sound on and
# M/N free to use; n recorded with every result.

feature: rightmove-invaders-sound
kpis:
  - id: K1
    name: Hits feel better with sound
    target: ">= 4 of 5 playtesters prefer the wave with sound"
    measured_by: playtest form
    window: once, before closing the feature
    gate: soft
  - id: K2
    name: The beat adds urgency
    target: ">= 4 of 5 say the last 10 hurdles felt more urgent with the beat"
    measured_by: playtest form
    window: once, before closing the feature
    gate: soft
  - id: K3
    name: Mute is discoverable
    target: "5 of 5 find how to mute within 10 s, unaided"
    measured_by: timed playtest task
    window: once, before closing the feature
    gate: soft
  - id: K4
    name: Music is wanted
    target: ">= 60% have music on at the end of wave 3; 40-60%: re-tune once and repeat; still < 60% after the repeat, or < 40% at first: drop slices 06-07"
    measured_by: "observing the N setting at the end of wave 3; the form also asks: could you hear the beat over the music?"
    window: once after slice 07, plus one repeat if 40-60%
    gate: soft
  - id: K5
    name: Sound is immediate
    target: "the shot sound starts no more than 17 ms (one 60 Hz frame) after the key press (journal 'at' minus key-press time, both on the page clock)"
    measured_by: "@kpi-K5 scenario 'A shot is heard in the same frame it is fired', every run in 3 engines"
    window: every run
    gate: hard
  - id: K6
    name: No performance cost
    target: "sound adds <= 0.5 ms frame work over the same stress run without sound: p95 in Chromium; mean in Firefox and WebKit (1 ms timers)"
    measured_by: "stress run with and without sound; tool = the spike script (git show 6801c46:.spike/measure/measure.js), adapted to the real game in slice 04"
    window: once per slice that adds sounds
    gate: soft
  - id: K7
    name: No errors
    target: "0 page errors or audio warnings; silent fallback when sound is unavailable or fails to start"
    measured_by: "@kpi-K7 scenarios, every run in 3 engines"
    window: every run
    gate: hard
  - id: K8
    name: Big moments land
    target: ">= 4 of 5 name the outcome (bonus, wave cleared, game over) from the jingle alone, eyes closed"
    measured_by: playtest task
    window: once, after slice 05
    gate: soft
  - id: K9
    name: Sound on by default is welcome
    target: "<= 1 of 5 say the sound bothered them or muted it for that reason"
    measured_by: post-session question
    window: once, before closing the feature
    gate: soft

  # rightmove-invaders-leaderboard, added by DEVOPS on 2026-10-24 and revised after the platform review (iteration 2):
  # operational contracts for the Score API on Netlify (legacy Free plan). Each row names its own feature; the top-level
  # `feature` above is the file's first one. scripts/smoke-leaderboard.mjs is specified in that feature's feature-delta.md
  # ("Wave: DEVOPS / [REF] CI/CD pipeline outline"). DELIVER wrote it (2026-10-25: 6f5be2d, revised in 78e0a0f), and it
  # has not run yet. It runs on a deploy preview before the first merge to main, with the user's OK to push. Its
  # write guard refuses any POST to a production host or to the published deploy, and any POST before an empty first GET.
  # Release-check triggers: a change to netlify/functions/scores.mjs, the @netlify/blobs version, the functions bundler
  # settings, config.rateLimit or the cache headers re-runs K10, K11 and K14.
  # local_scenarios (added by DISTILL, 2026-10-24): the @kpi-K… acceptance scenarios that check the same contract
  # locally, on the Blobs emulator, at the handler's level (project in-memory, tag @server). DELIVER enabled them
  # (2026-10-25), and they run in every Netlify build. They back a KPI; they never replace its
  # Netlify measurement, and the targets are unchanged. K10, K13 and K15 have no local scenario: they are
  # latency, deploy context and quota on Netlify itself (K13's chooseStore case table is a DELIVER unit test,
  # tests/unit/choose-store.spec.js).
  # baseline (added by DELIVER, 2026-10-25): what has been measured so far, and where. The targets are unchanged.
  # Nothing has been measured on Netlify yet: K10, K11, K12 and K14 wait for the preview smoke run, K13 for the first
  # production deploy with the function, and K15 for the first day after the merge. Pipeline baselines on the
  # developer machine, for the build-minute and release-check estimates: npm run build (bddgen, then the unit and
  # in-memory projects: 128 tests) takes about 2-3 s; npm test (326 tests, three browsers) takes about 14 min.
  - id: K10
    feature: rightmove-invaders-leaderboard
    name: Signing is quick on Netlify
    target: "p95 of POST + GET over 30 paced pairs on a deploy preview < 1000 ms, timed on the client (SPIKE budget); the cold start (the deploy's first request) is recorded as a separate sample, outside the p95"
    measured_by: "scripts/smoke-leaderboard.mjs preview run, steps 1 and 6"
    window: "the preview before the first merge to main; again on every release-check trigger"
    gate: hard
    baseline: "none measured: waits for the preview run. There is no local twin: the emulator's submit p95 (20 ms for 20 players in the SPIKE) says little about Netlify, where every Blobs call is a network round trip"
  - id: K11
    feature: rightmove-invaders-leaderboard
    name: No signature lost on real Netlify Blobs
    target: "on a throwaway preview whose only change removes the rate-limit rule (K11 measures Blobs under concurrency, not the rule; the rule is K14's): 20 simultaneous POSTs all answer 200 with their own ids; each POST whose score is in the true top 10 finds its own id in its answer; the next uncached GET equals the expected top 10 (0 lost). Only a 429 is inconclusive (the rule wasn't removed: fix the throwaway branch and rerun on a fresh preview; never a pass). Any other non-200 (503 not-saved, 500, ...) fails K11; the first result is recorded, and no rerun can turn it into a pass"
    measured_by: "scripts/smoke-leaderboard.mjs burst run, steps 1-3; the throwaway preview and its branch are deleted right after"
    window: "as K10"
    gate: hard
    local_scenarios: "@kpi-K11 'However many signatures arrive at once, none that belongs in the top ten is lost' (tests/e2e/rightmove-invaders-leaderboard/acceptance/milestone-3-no-signature-lost.feature): fast-check batches of up to 30 simultaneous signatures (the SPIKE's N = 100 was store-level evidence); every one answered 200 and the table read afterwards equals the true top 10. Not checked locally: each signer finding their own row in their own answer (the emulator can cut a listing short during concurrent writes), which stays K11's"
    baseline: "local twin only, measured 2026-10-25 (DELIVER, enabled in 6f5be2d): the @kpi-K11 property ran in 126 ms in the build gate (20 batches of up to 30 simultaneous POSTs, seed 20261023), with every POST answered 200 and 0 signatures lost from the top 10. No Netlify measurement until the burst run"
  - id: K12
    feature: rightmove-invaders-leaderboard
    name: Previews never reach the production table, and the function bundle is complete
    target: "the write guard refuses every production host (the custom domain, <site>.netlify.app, main--<site>, any permalink outside the unpublished check) before any POST; a fresh preview answers {scores: []} and logs scope=deploy, context=deploy-preview, published=false (the published flag arrives from the Functions v2 Context); no preview id appears in a production GET; a POST with blocked initials gets 400 initials-not-allowed (proving the bundled src/game/high-scores.js)"
    measured_by: "scripts/smoke-leaderboard.mjs preview run, steps 1, 4 and 7, plus the preview's function log read by hand"
    window: "as K10"
    gate: hard
    local_scenarios: "@kpi-K12 'Initials on the word filter are refused by the table too' (milestone-2-signing-the-table.feature): 400 initials-not-allowed and nothing saved, the local twin of smoke step 4: it proves the handler's refusal, not that the esbuild bundle includes src/game/high-scores.js (that is smoke step 4 on a preview). Preview isolation itself is Netlify's (chooseStore unit table, smoke steps 1 and 7)"
    baseline: "local twin only: the @kpi-K12 scenario has been green in every build since 2026-10-25 (enabled in f91dc92), and the write guard's refusals are unit-tested (tests/unit/smoke-write-guard.spec.js). None measured on Netlify: waits for the preview run"
  - id: K13
    feature: rightmove-invaders-leaderboard
    name: Only the published production deploy uses the site-wide store
    target: "one production GET /api/scores?table=<random> (GET only; a cache miss, so the function runs) logs scope=site, context=production, published=true; once there is an older production deploy with the function, the unpublished check (write guard: a permalink whose ID differs from the published deploy's ID, read from the Netlify API with the owner's token or confirmed by the owner typing it back after the script prints the target's ID, never from a command-line flag; and an empty first GET) POSTs once, answers 200, logs scope=deploy, context=production, published=false, and its id is absent from a production GET"
    measured_by: "scripts/smoke-leaderboard.mjs --production, and once --unpublished <permalink> (API route with NETLIFY_AUTH_TOKEN and --site-id, or interactive confirmation); then Netlify > Cloud compute > Functions > scores (retention unverified, so the same day); until the older deploy exists, the chooseStore unit table covers the unpublished case"
    window: "after every production deploy and every rollback, the same day; the unpublished check once, after the second production deploy with the function"
    gate: hard
    baseline: "none measured: waits for the first production deploy with the function. Locally, the chooseStore case table (12 cases) and the entry over a fake deploy environment are green (tests/unit/choose-store.spec.js, tests/unit/scores-entry.spec.js)"
  - id: K14
    feature: rightmove-invaders-leaderboard
    name: The rate limit and the GET cache hold on Netlify
    target: "on the shipped config: the deploy log lists the rule (10 per 60 s, ip + domain); steps 8a and 8b record the send rate actually achieved, and below 2 requests/s (8a) or 20 requests/s (8b) the step is inconclusive, never a pass; step 8a (2 requests/s for 125 s): a 429 within 16 s and at most 30 accepted in each full 60 s window (more than 20 is not a fail but triggers a documented recompute of the abuse table before the merge); step 8b (20 requests/s for 60 s, at most 1,200 invocations): a 429 within 11 s, and the count replaces the 10 + 10r assumption in the abuse table (a count above 210 is not a no-go: it triggers a documented recompute, and the user decides before the merge); a GET 61 s later is 200; a GET is a CDN hit within 15 s, also with an unrelated query string; no 429 is served from the cache. A missing Cache-Status header is a fail, not a vacuous pass; the header's real name is confirmed on the first preview. The first preview also records a function answer's full header set (a GET 200, a 400, a POST 200): exactly one Cache-Control value as in DDD-6, Netlify-Vary query=table present, and nothing conflicting with DDD-6 (the netlify.toml /* security headers are expected to be absent, since Netlify doesn't apply custom headers to function answers; if present, they are recorded and harmless)"
    measured_by: "scripts/smoke-leaderboard.mjs preview run, steps 5, 8a, 8b and 9, plus the deploy log's post-processing stage"
    window: "the preview before the first merge (go/no-go: no-go = no merge to main); again on every release-check trigger"
    gate: hard
    local_scenarios: "@kpi-K14 'An empty high-score table is read as empty, and everyone sees it at most 15 seconds old' (milestone-1-reading-the-table.feature) and 'A valid signature is saved, and the answer shows where it ranks' (milestone-2-signing-the-table.feature): the header set of a GET 200 (Netlify-CDN-Cache-Control public, s-maxage=15, durable; Cache-Control public, max-age=0, must-revalidate) and of a POST 200 (no-store), with Netlify-Vary query=table and nosniff; every refusal scenario checks no-store and Netlify-Vary too. The local check is at handler level: it proves what the function sets, not that Netlify honours it. The rate limit and the CDN's real behaviour stay K14's on a preview"
    baseline: "local twins only: both @kpi-K14 scenarios have been green in every build since 2026-10-25 (enabled in 1d3b70d and 8952f9b), and the exported config is pinned by a unit test (tests/unit/scores-entry.spec.js). None measured on Netlify: the rule, the real cap of one fast IP (step 8b) and the CDN cache wait for the preview run"
  - id: K15
    feature: rightmove-invaders-leaderboard
    name: Function invocations stay under half the free quota
    target: "< 62,500 invocations per calendar month (50% of the legacy Free 125k per site). The daily check records the cumulative Usage total daily and at every usage email; the day's rate is the difference between readings; if (125,000 - total) / rate puts 100% before the 1st of next month, the kill switch is pulled. Blobs: the account's Blobs limit and usage are recorded before the merge and in each daily check if visible; if none is visible, Blobs operations are recorded as an unmonitored residual risk"
    measured_by: "Netlify > Cloud compute > Functions > Usage (a cumulative count for the billing period; what it shows on legacy Free is recorded on day 1); Netlify's usage emails at 50/75/90/100%; the account's billing and usage pages for Blobs"
    window: "daily, on every usage email, and every few hours while abuse is suspected"
    gate: soft
    baseline: "none measured: the first reading is the Usage total on the first day after the merge"
